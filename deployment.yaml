
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-dashboard
  labels:
    app: weather-dashboard

spec:
  replicas: 1

  selector:
    matchLabels:
      app: weather-dashboard

  template:
    metadata:
      labels:
        app: weather-dashboard

    spec:
      containers:
        - name: weather-dashboard
          image: weather-dashboard:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8501

          envFrom:
            - secretRef:
                name: weather-dashboard-secret

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
